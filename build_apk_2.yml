name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev
          pip install --user 'buildozer==1.5.0' cython
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        run: |
          sudo rm -rf /usr/lib/jvm/temurin-11-jdk-amd64 2>/dev/null || true
          sudo rm -rf /usr/lib/jvm/msopenjdk-11 2>/dev/null || true
          unset JAVA_HOME_11_X64
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java 2>/dev/null || true
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac 2>/dev/null || true
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$HOME/.local/bin:$JAVA_HOME/bin:$PATH
          pkill -f gradle 2>/dev/null || true
          rm -rf ~/.gradle/daemon ~/.gradle/caches 2>/dev/null || true
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" > ~/.gradle/gradle.properties
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          yes | buildozer android debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebook-tts-reader-apk
          path: bin/*.apk
