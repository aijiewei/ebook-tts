name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --user buildozer==1.5.0 cython
      - name: Build
        run: |
          export PATH=$HOME/.local/bin:$PATH
          yes | buildozer android debug
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        with:
          name: ebook-tts-reader-apk
          path: bin/*.apk
