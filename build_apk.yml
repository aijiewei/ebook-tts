name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev libsqlite3-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Fix NDK version for CI compatibility
        run: |
          sed -i 's/android.ndk = 27/android.ndk = 25c/' buildozer.spec
          sed -i 's/android.ndk_version = 27c/android.ndk_version = 25c/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        timeout-minutes: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebook-tts-reader-apk
          path: bin/*.apk
